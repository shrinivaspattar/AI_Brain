name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aibrain
          POSTGRES_PASSWORD: aibrain
          POSTGRES_DB: aibrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aibrain -d aibrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: aibrain
      DATABASE_URL: postgresql+psycopg2://aibrain:aibrain@localhost:5432/aibrain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The suite's integration tests target `aibrain_test` (never `aibrain`),
      # so both databases exist and are migrated to head, as on a dev machine.
      - name: Create test database
        run: psql -h localhost -U aibrain -d aibrain -c "CREATE DATABASE aibrain_test;"

      - name: Migrate aibrain
        working-directory: backend
        run: alembic upgrade head

      - name: Migrate aibrain_test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://aibrain:aibrain@localhost:5432/aibrain_test
        run: alembic upgrade head

      # Ollama is not available in CI: tests that need a live model skip
      # themselves; everything else uses fakes or real Postgres.
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Experiment harness tests
        run: python -m pytest scripts/exp001 -q

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ai-brain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container must actually start and answer, not just build. The
      # URL is a placeholder: the engine connects lazily and /health never
      # touches the database.
      - name: Smoke test /health
        run: |
          docker run -d --name ai-brain -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg2://x:x@localhost:5432/x \
            ai-brain:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "container healthy"; exit 0
            fi
            sleep 1
          done
          docker logs ai-brain
          exit 1
