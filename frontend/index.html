<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI_Brain</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>AI_Brain</h1>
      <button id="new-conversation-btn" type="button" title="Start a new conversation">New conversation</button>
    </header>

    <main id="messages" aria-live="polite"></main>

    <form id="composer">
      <textarea
        id="message-input"
        placeholder="Ask AI_Brain something..."
        rows="2"
        autofocus
      ></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
